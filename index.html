<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RL Ideas — Biblioteca de Contenido de Rocket League</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0a0c10',
                        cardbg: '#11151c',
                        cardhover: '#171c26',
                        bordercolor: '#1e2638',
                        cyanaccent: '#54D8F5',
                        cyanhover: '#3bc5e4',
                        mutetext: '#7d889b'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

            background: #0a0c10;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e2638;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #54D8F5;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0c10;
            color: #f0f3f6;
        }
        .fade-in {
            animation: fadeIn 0.2s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(3px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen flex flex-col antialiased selection:bg-cyanaccent selection:text-darkbg">

            <!-- Navigation Links -->

                <button onclick="switchView('inicio')" id="nav-inicio" class="nav-btn w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-medium transition-all text-slate-300 hover:bg-cardhover hover:text-white">
                    <div class="flex items-center space-x-2.5">
                        <i class="fa-solid fa-house w-4 text-center text-cyanaccent/80"></i>
                        <span>Inicio</span>
                    </div>
                </button>

                <button onclick="switchView('secciones')" id="nav-secciones" class="nav-btn w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-medium transition-all text-slate-300 hover:bg-cardhover hover:text-white">
                    <div class="flex items-center space-x-2.5">
                        <i class="fa-solid fa-layer-group w-4 text-center text-cyanaccent/80"></i>
                        <span>Mis Secciones</span>
                    </div>
                    <span id="navCountSecciones" class="text-[10px] px-1.5 py-0.5 rounded-md bg-bordercolor text-mutetext">0</span>
                </button>

                <button onclick="switchView('todas')" id="nav-todas" class="nav-btn w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-medium transition-all text-slate-300 hover:bg-cardhover hover:text-white">
                    <div class="flex items-center space-x-2.5">
                        <i class="fa-solid fa-box-archive w-4 text-center text-cyanaccent/80"></i>
                        <span>Todas las Ideas</span>
                    </div>
                    <span id="navCountTodas" class="text-[10px] px-1.5 py-0.5 rounded-md bg-bordercolor text-mutetext">0</span>
                </button>

                <button onclick="switchView('terminadas')" id="nav-terminadas" class="nav-btn w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-medium transition-all text-slate-300 hover:bg-cardhover hover:text-white">
                    <div class="flex items-center space-x-2.5">
                        <i class="fa-solid fa-circle-check w-4 text-center text-cyanaccent/80"></i>
                        <span>Ideas Terminadas</span>
                    </div>
                    <span id="navCountTerminadas" class="text-[10px] px-1.5 py-0.5 rounded-md bg-bordercolor text-mutetext">0</span>
                </button>

                <div class="pt-4 pb-2 px-2.5 text-[10px] font-semibold uppercase tracking-wider text-mutetext">Sistema</div>

                <button onclick="switchView('config')" id="nav-config" class="nav-btn w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-medium transition-all text-slate-300 hover:bg-cardhover hover:text-white">

                        <span>Backups & Config</span>
                    </div>
                </button>
            </div>

            <!-- Footer status -->
            <div class="p-3 border-t border-bordercolor bg-cardbg">
                <div class="flex items-center justify-between text-[11px] text-mutetext">
                    <span class="flex items-center space-x-1.5">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 inline-block"></span>
                        <span>localStorage activo</span>
                    </span>
                    <span class="font-mono text-[10px]">v2.0</span>
                </div>
            </div>
        </aside>

        <!-- Main Area -->
        <main class="flex-1 flex flex-col min-w-0 overflow-hidden bg-darkbg">
            <!-- Header Nav -->
            <header class="h-14 border-b border-bordercolor bg-cardbg/80 backdrop-blur-md px-5 flex items-center justify-between z-30">
                <div class="flex items-center space-x-3">
                    <button id="openSidebarBtn" class="md:hidden text-slate-300 hover:text-white p-1">

                    </button>
                    <h2 id="currentViewTitle" class="text-sm font-semibold text-white tracking-tight flex items-center space-x-2">
                        <span>Inicio</span>
                    </h2>
                </div>

                <div class="flex items-center space-x-3">
                    <!-- Search Input -->
                    <div class="relative hidden sm:block w-60 md:w-72">
                        <span class="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none text-mutetext">
                            <i class="fa-solid fa-magnifying-glass text-xs"></i>
                        </span>
                        <input type="text" id="globalSearchInput" oninput="handleGlobalSearch(this.value)" placeholder="Buscar idea por título..." class="w-full pl-8 pr-3 py-1.5 bg-darkbg border border-bordercolor rounded-lg text-xs text-slate-200 placeholder-mutetext focus:outline-none focus:border-cyanaccent transition-colors">
                    </div>

                    <!-- Add Button -->
                    <button onclick="openIdeaModal()" class="flex items-center space-x-1.5 bg-cyanaccent hover:bg-cyanhover text-darkbg font-semibold px-3 py-1.5 rounded-lg text-xs transition-colors shadow-sm">
                        <i class="fa-solid fa-plus text-xs"></i>
                        <span class="hidden sm:inline">Nueva Idea</span>
                    </button>
                </div>
            </header>

            <!-- Scrollable Content -->
            <div id="mainContentContainer" class="flex-1 overflow-y-auto p-5 md:p-6">
                <!-- Dynamically populated -->
            </div>

    </div>

    <!-- Idea Modal (Strictly Title & Section & Status only) -->
    <div id="ideaModal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-xs flex items-center justify-center p-4 hidden">
        <div class="bg-cardbg border border-bordercolor rounded-xl w-full max-w-md overflow-hidden shadow-2xl fade-in">
            <div class="px-5 py-3.5 border-b border-bordercolor flex items-center justify-between">
                <h3 id="ideaModalTitle" class="text-xs font-semibold text-white flex items-center space-x-2 uppercase tracking-wide">
                    <i class="fa-solid fa-lightbulb text-cyanaccent"></i>
                    <span>Nueva Idea de Contenido</span>
                </h3>
                <button onclick="closeIdeaModal()" class="text-mutetext hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>
            <form id="ideaForm" onsubmit="saveIdeaForm(event)" class="p-5 space-y-4">
                <input type="hidden" id="ideaId">
                
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Nombre / Título de la idea *</label>
                    <input type="text" id="ideaTitle" required placeholder="Ej. Half Flip perfecto en 3 pasos" class="w-full px-3 py-2 bg-darkbg border border-bordercolor rounded-lg text-xs text-slate-200 placeholder-mutetext focus:outline-none focus:border-cyanaccent">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Sección *</label>
                        <select id="ideaSection" required class="w-full px-3 py-2 bg-darkbg border border-bordercolor rounded-lg text-xs text-slate-200 focus:outline-none focus:border-cyanaccent">
                            <!-- Options inserted JS -->
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Estado</label>
                        <select id="ideaStatus" class="w-full px-3 py-2 bg-darkbg border border-bordercolor rounded-lg text-xs text-slate-200 focus:outline-none focus:border-cyanaccent">
                            <option value="Pendiente">Pendiente</option>
                            <option value="En proceso">En proceso</option>
                            <option value="Terminada">Terminada</option>
                        </select>
                    </div>
                </div>

                <div class="pt-2 flex items-center justify-end space-x-2">
                    <button type="button" onclick="closeIdeaModal()" class="px-3.5 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:bg-cardhover transition-colors">Cancelar</button>
                    <button type="submit" class="px-4 py-1.5 rounded-lg text-xs font-semibold bg-cyanaccent hover:bg-cyanhover text-darkbg transition-colors shadow-sm">Guardar Idea</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Section Modal -->
    <div id="sectionModal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-xs flex items-center justify-center p-4 hidden">
        <div class="bg-cardbg border border-bordercolor rounded-xl w-full max-w-md overflow-hidden shadow-2xl fade-in">
            <div class="px-5 py-3.5 border-b border-bordercolor flex items-center justify-between">
                <h3 id="sectionModalTitle" class="text-xs font-semibold text-white flex items-center space-x-2 uppercase tracking-wide">
                    <i class="fa-solid fa-layer-group text-cyanaccent"></i>
                    <span>Nueva Sección</span>
                </h3>
                <button onclick="closeSectionModal()" class="text-mutetext hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>
            <form id="sectionForm" onsubmit="saveSectionForm(event)" class="p-5 space-y-4">
                <input type="hidden" id="sectionId">
                
                <div class="grid grid-cols-4 gap-3">
                    <div class="col-span-3">
                        <label class="block text-xs font-medium text-slate-300 mb-1">Nombre *</label>
                        <input type="text" id="sectionName" required placeholder="Ej. Torneos y Ranked" class="w-full px-3 py-2 bg-darkbg border border-bordercolor rounded-lg text-xs text-slate-200 placeholder-mutetext focus:outline-none focus:border-cyanaccent">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Icono</label>
                        <input type="text" id="sectionIcon" placeholder="🏆" maxlength="4" class="w-full px-3 py-2 bg-darkbg border border-bordercolor rounded-lg text-xs text-center text-slate-200 focus:outline-none focus:border-cyanaccent">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Descripción breve (opcional)</label>
                    <input type="text" id="sectionDesc" placeholder="Ideas sobre torneos, ranked y emparejamientos..." class="w-full px-3 py-2 bg-darkbg border border-bordercolor rounded-lg text-xs text-slate-200 placeholder-mutetext focus:outline-none focus:border-cyanaccent">
                </div>

                <div class="pt-2 flex items-center justify-end space-x-2">
                    <button type="button" onclick="closeSectionModal()" class="px-3.5 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:bg-cardhover transition-colors">Cancelar</button>
                    <button type="submit" class="px-4 py-1.5 rounded-lg text-xs font-semibold bg-cyanaccent hover:bg-cyanhover text-darkbg transition-colors shadow-sm">Guardar Sección</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification Holder -->
    <div id="toastContainer" class="fixed bottom-4 right-4 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <script>
        // Initial Preloaded Sections (Default Rocket League Categories)

            },
            {

                name: 'Jugadas y clips',

        // Initial Preloaded Ideas (Strictly Name, Section, Status, Creation Date, Completion Date)
        const DEFAULT_IDEAS = [
            // Seccion 1
            { id: 'idea-1', title: 'Half Flip', sectionId: 'sec-1', status: 'Terminada', createdAt: '2026-03-01T10:00:00.000Z', completedAt: '2026-03-02T15:00:00.000Z' },
            { id: 'idea-2', title: 'Wave Dash', sectionId: 'sec-1', status: 'Pendiente', createdAt: '2026-03-03T11:00:00.000Z', completedAt: null },
            { id: 'idea-3', title: 'Fast Aerial', sectionId: 'sec-1', status: 'Pendiente', createdAt: '2026-03-04T12:00:00.000Z', completedAt: null },
            { id: 'idea-4', title: 'Powerslide', sectionId: 'sec-1', status: 'Pendiente', createdAt: '2026-03-05T09:00:00.000Z', completedAt: null },
            { id: 'idea-5', title: 'Air Roll', sectionId: 'sec-1', status: 'En proceso', createdAt: '2026-03-06T14:00:00.000Z', completedAt: null },
            { id: 'idea-6', title: 'Powershots', sectionId: 'sec-1', status: 'Pendiente', createdAt: '2026-03-07T10:00:00.000Z', completedAt: null },
            { id: 'idea-7', title: 'Powerslide Cut', sectionId: 'sec-1', status: 'Pendiente', createdAt: '2026-03-08T11:00:00.000Z', completedAt: null },
            { id: 'idea-8', title: 'Fast Kickoff', sectionId: 'sec-1', status: 'Pendiente', createdAt: '2026-03-09T13:00:00.000Z', completedAt: null },
            { id: 'idea-9', title: 'Recuperaciones después de saltar', sectionId: 'sec-1', status: 'Pendiente', createdAt: '2026-03-10T15:00:00.000Z', completedAt: null },
            { id: 'idea-10', title: 'Despejes y defensa desde el backboard', sectionId: 'sec-1', status: 'Pendiente', createdAt: '2026-03-11T16:00:00.000Z', completedAt: null },

            // Seccion 2
            { id: 'idea-11', title: 'Aprendiendo a hacer Flip Resets desde cero', sectionId: 'sec-2', status: 'En proceso', createdAt: '2026-03-01T12:00:00.000Z', completedAt: null },
            { id: 'idea-12', title: 'Mi primer día practicando Musty Flicks', sectionId: 'sec-2', status: 'Pendiente', createdAt: '2026-03-02T13:00:00.000Z', completedAt: null },
            { id: 'idea-13', title: 'Intentando aprender Double Taps', sectionId: 'sec-2', status: 'Pendiente', createdAt: '2026-03-03T14:00:00.000Z', completedAt: null },

            // Seccion 3
            { id: 'idea-14', title: 'The Art of Saves', sectionId: 'sec-3', status: 'Terminada', createdAt: '2026-03-01T16:00:00.000Z', completedAt: '2026-03-03T18:00:00.000Z' },
            { id: 'idea-15', title: 'The Art of Double Taps', sectionId: 'sec-3', status: 'Pendiente', createdAt: '2026-03-02T11:00:00.000Z', completedAt: null },
            { id: 'idea-16', title: 'The Art of Air Dribbles', sectionId: 'sec-3', status: 'Pendiente', createdAt: '2026-03-03T12:00:00.000Z', completedAt: null },

            // Seccion 4
            { id: 'idea-17', title: 'Mejores jugadas de mis partidas', sectionId: 'sec-4', status: 'Pendiente', createdAt: '2026-03-01T17:00:00.000Z', completedAt: null },
            { id: 'idea-18', title: 'Mejores goles de la semana', sectionId: 'sec-4', status: 'Pendiente', createdAt: '2026-03-02T18:00:00.000Z', completedAt: null },

            // Seccion 5
            { id: 'idea-19', title: 'Situaciones típicas de las partidas ranked', sectionId: 'sec-5', status: 'Pendiente', createdAt: '2026-03-01T13:00:00.000Z', completedAt: null },
            { id: 'idea-20', title: 'Cosas que solo entiende alguien que juega Rocket League', sectionId: 'sec-5', status: 'Pendiente', createdAt: '2026-03-02T14:00:00.000Z', completedAt: null },

            // Seccion 6
            { id: 'idea-21', title: 'Errores que te mantienen estancado en Champion', sectionId: 'sec-6', status: 'Pendiente', createdAt: '2026-03-01T19:00:00.000Z', completedAt: null },
            { id: 'idea-22', title: 'Cómo rotar mejor', sectionId: 'sec-6', status: 'Pendiente', createdAt: '2026-03-02T10:00:00.000Z', completedAt: null }
        ];

        // Global State
        let appState = {
            currentView: 'inicio',
            activeSectionId: null,
            searchQuery: '',
            filterSection: 'all',
            filterStatus: 'all',
            sortBy: 'newest',
            sections: [],
            ideas: []
        };

        function initApp() {
            const savedSections = localStorage.getItem('rl_ideas_sections_v2');
            const savedIdeas = localStorage.getItem('rl_ideas_items_v2');

            if (!savedSections || !savedIdeas) {
                appState.sections = DEFAULT_SECTIONS;
                appState.ideas = DEFAULT_IDEAS;
                saveToLocalStorage();
            } else {
                try {
                    appState.sections = JSON.parse(savedSections);
                    appState.ideas = JSON.parse(savedIdeas);
                } catch (e) {
                    appState.sections = DEFAULT_SECTIONS;
                    appState.ideas = DEFAULT_IDEAS;
                    saveToLocalStorage();
                }
            }

            setupMobileSidebar();
            updateNavigationCounts();
            switchView('inicio');
        }

        function saveToLocalStorage() {
            localStorage.setItem('rl_ideas_sections_v2', JSON.stringify(appState.sections));
            localStorage.setItem('rl_ideas_items_v2', JSON.stringify(appState.ideas));
            updateNavigationCounts();
        }

        function setupMobileSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const openBtn = document.getElementById('openSidebarBtn');
            const closeBtn = document.getElementById('closeSidebarBtn');

            function toggleSidebar() {
                sidebar.classList.toggle('-translate-x-full');
                overlay.classList.toggle('hidden');
            }

            openBtn.addEventListener('click', toggleSidebar);
            closeBtn.addEventListener('click', toggleSidebar);
            overlay.addEventListener('click', toggleSidebar);
        }

        function updateNavigationCounts() {
            const totalIdeas = appState.ideas.length;
            const terminadasCount = appState.ideas.filter(i => i.status === 'Terminada').length;
            const seccionesCount = appState.sections.length;

            document.getElementById('navCountSecciones').textContent = seccionesCount;
            document.getElementById('navCountTodas').textContent = totalIdeas;
            document.getElementById('navCountTerminadas').textContent = terminadasCount;
        }

        function switchView(viewName, param = null) {
            appState.currentView = viewName;
            if (param) appState.activeSectionId = param;

            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('bg-cardhover', 'text-white');
                btn.classList.add('text-slate-300');
            });
            const activeBtn = document.getElementById(`nav-${viewName}`);
            if (activeBtn) activeBtn.classList.add('bg-cardhover', 'text-white');

            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (!sidebar.classList.contains('-translate-x-full') && window.innerWidth < 768) {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }

            renderCurrentView();
        }

        function renderCurrentView() {
            const container = document.getElementById('mainContentContainer');
            const titleEl = document.getElementById('currentViewTitle');
            container.innerHTML = '';

            switch (appState.currentView) {
                case 'inicio':
                    titleEl.innerHTML = `<span>Inicio</span>`;
                    container.innerHTML = renderHomeView();
                    break;
                case 'secciones':
                    titleEl.innerHTML = `<span>Mis Secciones</span>`;
                    container.innerHTML = renderSectionsView();
                    break;
                case 'seccion-detalle':
                    const sec = appState.sections.find(s => s.id === appState.activeSectionId);
                    const secName = sec ? `${sec.icon || '📁'} ${sec.name}` : 'Sección';
                    titleEl.innerHTML = `<span>${secName}</span>`;
                    container.innerHTML = renderSectionDetailView(appState.activeSectionId);
                    break;
                case 'todas':
                    titleEl.innerHTML = `<span>Todas las Ideas</span>`;
                    container.innerHTML = renderAllIdeasView();
                    break;
                case 'terminadas':
                    titleEl.innerHTML = `<span>Ideas Terminadas</span>`;
                    container.innerHTML = renderTerminatedView();
                    break;
                case 'config':
                    titleEl.innerHTML = `<span>Copias de seguridad & Configuración</span>`;
                    container.innerHTML = renderConfigView();
                    break;
                default:
                    container.innerHTML = `<div class="text-xs text-mutetext">Vista no encontrada.</div>`;
            }
        }

        // --- VIEW 1: HOME ---
        function renderHomeView() {
            const total = appState.ideas.length;

                                <input type="text" id="filterSearch" value="${appState.searchQuery}" oninput="appState.searchQuery=this.value; renderAllIdeasGrid();" placeholder="Filtrar por nombre..." class="w-full pl-8 pr-3 py-1.5 bg-darkbg border border-bordercolor rounded-lg text-xs text-slate-200 placeholder-mutetext focus:outline-none focus:border-cyanaccent">

                                <option value="En proceso" ${appState.filterStatus === 'En proceso' ? 'selected' : ''}>En proceso</option>

                            <span class="text-[10px] text-mutetext uppercase">Ordenar:</span>
                            <select id="sortSelect" onchange="appState.sortBy=this.value; renderAllIdeasGrid();" class="px-2.5 py-1.5 bg-darkbg border border-bordercolor rounded-lg text-xs text-slate-200 focus:outline-none focus:border-cyanaccent">
                                <option value="newest" ${appState.sortBy === 'newest' ? 'selected' : ''}>Más nuevas</option>
                                <option value="oldest" ${appState.sortBy === 'oldest' ? 'selected' : ''}>Más antiguas</option>
                                <option value="name" ${appState.sortBy === 'name' ? 'selected' : ''}>Nombre (A-Z)</option>

                    <!-- Idea List -->
                    <div id="allIdeasGridContainer" class="space-y-2">
                        ${filteredIdeas.length === 0 ? '<div class="py-12 text-center text-mutetext text-xs bg-cardbg border border-bordercolor rounded-xl">No se encontraron ideas.</div>' :
                          filteredIdeas.map(idea => renderIdeaRow(idea)).join('')}
                    </div>
                </div>
            `;

        function renderAllIdeasGrid() {
            const container = document.getElementById('allIdeasGridContainer');
            if (!container) return;
            const filteredIdeas = getFilteredAndSortedIdeas();
            container.innerHTML = filteredIdeas.length === 0 ? 
                '<div class="py-12 text-center text-mutetext text-xs bg-cardbg border border-bordercolor rounded-xl">No se encontraron ideas.</div>' :
                filteredIdeas.map(idea => renderIdeaRow(idea)).join('');
        }

        function getFilteredAndSortedIdeas() {
            let result = [...appState.ideas];

            if (appState.searchQuery && appState.searchQuery.trim() !== '') {
                const q = appState.searchQuery.toLowerCase();
                result = result.filter(i => i.title.toLowerCase().includes(q));
            }

            if (appState.filterSection !== 'all') {
                result = result.filter(i => i.sectionId === appState.filterSection);
            }

            if (appState.filterStatus !== 'all') {
                result = result.filter(i => i.status === appState.filterStatus);
            }

            result.sort((a, b) => {
                if (appState.sortBy === 'newest') return new Date(b.createdAt) - new Date(a.createdAt);
                if (appState.sortBy === 'oldest') return new Date(a.createdAt) - new Date(b.createdAt);
                if (appState.sortBy === 'name') return a.title.localeCompare(b.title);
                if (appState.sortBy === 'status') return a.status.localeCompare(b.status);
                return 0;
            });

            return result;
        }

                            <i class="fa-solid fa-triangle-exclamation text-rose-400 text-lg"></i>
                            <div>
                                <h3 class="text-xs font-bold text-white uppercase tracking-wider">Restablecer Datos</h3>
                                <p class="text-xs text-mutetext">Vuelve a cargar los datos predeterminados de fábrica.</p>

                        </button>
                    </div>
                </div>

        function renderIdeaRow(idea) {
            const sec = appState.sections.find(s => s.id === idea.sectionId);
            const secName = sec ? `${sec.icon || ''} ${sec.name}` : 'Sin sección';

            let statusBadgeClass = 'bg-amber-400/10 text-amber-400 border-amber-400/20';
            if (idea.status === 'Terminada') statusBadgeClass = 'bg-emerald-400/10 text-emerald-400 border-emerald-400/20';
            if (idea.status === 'En proceso') statusBadgeClass = 'bg-cyanaccent/10 text-cyanaccent border-cyanaccent/20';

            return `
                <div class="bg-cardbg border border-bordercolor hover:border-cyanaccent/30 rounded-xl px-4 py-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2.5 transition-all">
                    <div class="flex items-center space-x-3 min-w-0">
                        <!-- Quick status toggle -->

                        </button>

                        <div class="min-w-0">

                                <span>${secName}</span>
                                <span>·</span>
                                <span>Creada: ${new Date(idea.createdAt).toLocaleDateString()}</span>
                                ${idea.completedAt ? `<span>· Lista: ${new Date(idea.completedAt).toLocaleDateString()}</span>` : ''}
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center justify-between sm:justify-end space-x-2">
                        <span class="text-[9px] font-semibold px-2 py-0.5 rounded-md border ${statusBadgeClass}">${idea.status}</span>
                        
                        <div class="flex items-center space-x-1">
                            <button onclick="editIdea('${idea.id}')" class="p-1.5 text-mutetext hover:text-white transition-colors" title="Editar nombre/sección">
                                <i class="fa-solid fa-pen text-xs"></i>
                            </button>
                            <button onclick="duplicateIdea('${idea.id}')" class="p-1.5 text-mutetext hover:text-white transition-colors" title="Duplicar">
                                <i class="fa-solid fa-copy text-xs"></i>
                            </button>
                            <button onclick="deleteIdea('${idea.id}')" class="p-1.5 text-mutetext hover:text-rose-400 transition-colors" title="Eliminar">

        function openIdeaModal() {
            document.getElementById('ideaModalTitle').innerHTML = `<i class="fa-solid fa-lightbulb text-cyanaccent"></i><span>Nueva Idea de Contenido</span>`;
            document.getElementById('ideaId').value = '';
            document.getElementById('ideaTitle').value = '';
            document.getElementById('ideaStatus').value = 'Pendiente';
            
            populateSectionDropdown();
            document.getElementById('ideaModal').classList.remove('hidden');
        }

        function openIdeaModalWithSection(secId) {
            openIdeaModal();
            document.getElementById('ideaSection').value = secId;
        }

        function editIdea(id) {
            const idea = appState.ideas.find(i => i.id === id);
            if (!idea) return;

            document.getElementById('ideaModalTitle').innerHTML = `<i class="fa-solid fa-pen text-cyanaccent"></i><span>Editar Idea</span>`;
            document.getElementById('ideaId').value = idea.id;
            document.getElementById('ideaTitle').value = idea.title;
            document.getElementById('ideaStatus').value = idea.status;

            populateSectionDropdown();
            document.getElementById('ideaSection').value = idea.sectionId;
            document.getElementById('ideaModal').classList.remove('hidden');
        }

        function closeIdeaModal() {
            document.getElementById('ideaModal').classList.add('hidden');
        }

        function populateSectionDropdown() {
            const select = document.getElementById('ideaSection');
            select.innerHTML = appState.sections.map(s => `<option value="${s.id}">${s.icon || ''} ${s.name}</option>`).join('');
        }

        function saveIdeaForm(e) {
            e.preventDefault();
            const id = document.getElementById('ideaId').value;
            const title = document.getElementById('ideaTitle').value.trim();
            const sectionId = document.getElementById('ideaSection').value;
            const status = document.getElementById('ideaStatus').value;

            if (!title) return;

            if (id) {
                const idx = appState.ideas.findIndex(i => i.id === id);
                if (idx !== -1) {
                    const wasTerminated = appState.ideas[idx].status === 'Terminada';
                    const isTerminated = status === 'Terminada';
                    let completedAt = appState.ideas[idx].completedAt;
                    if (!wasTerminated && isTerminated) completedAt = new Date().toISOString();
                    if (wasTerminated && !isTerminated) completedAt = null;

                    appState.ideas[idx] = {
                        ...appState.ideas[idx],
                        title,
                        sectionId,
                        status,
                        completedAt
                    };
                }
                showToast('Idea actualizada');
            } else {
                const newIdea = {
                    id: 'idea-' + Date.now(),
                    title,
                    sectionId,
                    status,
                    createdAt: new Date().toISOString(),
                    completedAt: status === 'Terminada' ? new Date().toISOString() : null
                };
                appState.ideas.unshift(newIdea);
                showToast('Idea guardada');
            }

            saveToLocalStorage();
            closeIdeaModal();
            renderCurrentView();
        }

        function toggleQuickStatus(id) {
            const idea = appState.ideas.find(i => i.id === id);
            if (!idea) return;

            if (idea.status === 'Terminada') {
                idea.status = 'Pendiente';
                idea.completedAt = null;
                showToast('Idea reabierta');
            } else {
                idea.status = 'Terminada';
                idea.completedAt = new Date().toISOString();
                showToast('¡Idea completada!');
            }

            saveToLocalStorage();
            renderCurrentView();
        }

        function duplicateIdea(id) {
            const idea = appState.ideas.find(i => i.id === id);
            if (!idea) return;

            const duplicate = {
                ...idea,
                id: 'idea-' + Date.now(),
                title: idea.title + ' (Copia)',
                createdAt: new Date().toISOString(),
                completedAt: null,
                status: 'Pendiente'
            };

            appState.ideas.unshift(duplicate);
            saveToLocalStorage();
            renderCurrentView();
            showToast('Idea duplicada');
        }

        function deleteIdea(id) {
            appState.ideas = appState.ideas.filter(i => i.id !== id);
            saveToLocalStorage();
            renderCurrentView();
            showToast('Idea eliminada', 'info');
        }

        // Section Form Actions
        function openSectionModal() {
            document.getElementById('sectionModalTitle').innerHTML = `<i class="fa-solid fa-layer-group text-cyanaccent"></i><span>Nueva Sección</span>`;
            document.getElementById('sectionId').value = '';
            document.getElementById('sectionName').value = '';
            document.getElementById('sectionIcon').value = '📁';
            document.getElementById('sectionDesc').value = '';
            document.getElementById('sectionModal').classList.remove('hidden');
        }

        function editSection(id) {
            const sec = appState.sections.find(s => s.id === id);
            if (!sec) return;

            document.getElementById('sectionModalTitle').innerHTML = `<i class="fa-solid fa-pen text-cyanaccent"></i><span>Editar Sección</span>`;
            document.getElementById('sectionId').value = sec.id;
            document.getElementById('sectionName').value = sec.name;
            document.getElementById('sectionIcon').value = sec.icon || '📁';
            document.getElementById('sectionDesc').value = sec.description || '';
            document.getElementById('sectionModal').classList.remove('hidden');
        }

        function closeSectionModal() {
            document.getElementById('sectionModal').classList.add('hidden');
        }

        function saveSectionForm(e) {
            e.preventDefault();
            const id = document.getElementById('sectionId').value;
            const name = document.getElementById('sectionName').value.trim();
            const icon = document.getElementById('sectionIcon').value.trim() || '📁';
            const description = document.getElementById('sectionDesc').value.trim();

            if (!name) return;

            if (id) {
                const sec = appState.sections.find(s => s.id === id);
                if (sec) {
                    sec.name = name;
                    sec.icon = icon;
                    sec.description = description;
                }
                showToast('Sección actualizada');
            } else {
                const newSec = {
                    id: 'sec-' + Date.now(),
                    name,
                    icon,
                    description
                };
                appState.sections.push(newSec);
                showToast('Sección creada');
            }

            saveToLocalStorage();
            closeSectionModal();
            renderCurrentView();
        }

        function deleteSection(id) {
            appState.sections = appState.sections.filter(s => s.id !== id);
            appState.ideas = appState.ideas.filter(i => i.sectionId !== id);
            saveToLocalStorage();
            renderCurrentView();
            showToast('Sección eliminada', 'info');
        }

        // Backups
        function exportJSON() {
            const data = {
                version: '2.0',
                exportDate: new Date().toISOString(),
                sections: appState.sections,
                ideas: appState.ideas
            };

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `rl_ideas_backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast('Backup exportado');
        }

        function importJSON(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const parsed = JSON.parse(event.target.result);
                    if (!parsed.sections || !parsed.ideas) throw new Error("Archivo no válido");

                    appState.sections = parsed.sections;
                    appState.ideas = parsed.ideas;
                    saveToLocalStorage();
                    renderCurrentView();
                    showToast('Backup importado correctamente');
                } catch (err) {
                    showToast('Error al importar JSON', 'error');
                }
                e.target.value = '';
            };
            reader.readAsText(file);
        }

        function factoryReset() {
            appState.sections = DEFAULT_SECTIONS;
            appState.ideas = DEFAULT_IDEAS;
            saveToLocalStorage();
            renderCurrentView();
            showToast('Datos de fábrica cargados', 'info');
        }

        function handleGlobalSearch(val) {
            appState.searchQuery = val;
            if (appState.currentView !== 'todas') {
                switchView('todas');
            } else {
                renderAllIdeasGrid();
            }
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            
            let bgClass = 'bg-cardbg border-cyanaccent/40 text-white';
            let icon = 'fa-circle-check text-cyanaccent';
            if (type === 'error') {
                bgClass = 'bg-cardbg border-rose-500/40 text-white';
                icon = 'fa-triangle-exclamation text-rose-400';
            } else if (type === 'info') {
                bgClass = 'bg-cardbg border-bordercolor text-white';
                icon = 'fa-circle-info text-cyanaccent';
            }

            toast.className = `pointer-events-auto flex items-center space-x-2.5 px-3 py-2 rounded-lg border ${bgClass} shadow-lg fade-in text-xs font-medium`;
            toast.innerHTML = `<i class="fa-solid ${icon}"></i><span>${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.2s ease';
                setTimeout(() => toast.remove(), 200);
            }, 2500);
        }

        window.onload = function() {
            initApp();
        };
    </script>
</body>
</html>
