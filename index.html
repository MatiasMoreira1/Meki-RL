        // State Management
        let appState = {
            currentView: 'inicio',
            activeSectionId: null, // used when viewing specific section details

            sortBy: 'newest', // newest, oldest, name, status
            sections: [],
            ideas: []
        };

        // Initialize LocalStorage & Load Data
        function initApp() {
            const savedSections = localStorage.getItem('rl_ideas_sections');
            const savedIdeas = localStorage.getItem('rl_ideas_items');

            if (!savedSections || !savedIdeas) {
                appState.sections = DEFAULT_SECTIONS;
                appState.ideas = DEFAULT_IDEAS;
                saveToLocalStorage();
            } else {
                try {
                    appState.sections = JSON.parse(savedSections);
                    appState.ideas = JSON.parse(savedIdeas);
                } catch (e) {
                    console.error("Error parsing localStorage data, restoring defaults", e);
                    appState.sections = DEFAULT_SECTIONS;
                    appState.ideas = DEFAULT_IDEAS;
                    saveToLocalStorage();
                }
            }

            setupMobileSidebar();
            updateNavigationCounts();
            switchView('inicio');
        }

        function saveToLocalStorage() {
            localStorage.setItem('rl_ideas_sections', JSON.stringify(appState.sections));
            localStorage.setItem('rl_ideas_items', JSON.stringify(appState.ideas));
            updateNavigationCounts();
        }

        // Sidebar Navigation
        function setupMobileSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const openBtn = document.getElementById('openSidebarBtn');
            const closeBtn = document.getElementById('closeSidebarBtn');

            function toggleSidebar() {
                sidebar.classList.toggle('-translate-x-full');
                overlay.classList.toggle('hidden');
            }

            openBtn.addEventListener('click', toggleSidebar);
            closeBtn.addEventListener('click', toggleSidebar);
            overlay.addEventListener('click', toggleSidebar);
        }

        function updateNavigationCounts() {
            const totalIdeas = appState.ideas.length;
            const terminadasCount = appState.ideas.filter(i => i.status === 'Terminada').length;
            const seccionesCount = appState.sections.length;

            document.getElementById('navCountSecciones').textContent = seccionesCount;
            document.getElementById('navCountTodas').textContent = totalIdeas;
            document.getElementById('navCountTerminadas').textContent = terminadasCount;
        }

        function switchView(viewName, param = null) {
            appState.currentView = viewName;
            if (param) {
                appState.activeSectionId = param;
            }

            // Update active nav styling
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('bg-cardhover', 'text-white', 'border-l-2', 'border-cyanaccent');
                btn.classList.add('text-slate-300');
            });
            const activeBtn = document.getElementById(`nav-${viewName}`);
            if (activeBtn) {
                activeBtn.classList.add('bg-cardhover', 'text-white');
            }

            // Close mobile sidebar if open
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (!sidebar.classList.contains('-translate-x-full') && window.innerWidth < 768) {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }

            renderCurrentView();
        }

        function renderCurrentView() {
            const container = document.getElementById('mainContentContainer');
            const titleEl = document.getElementById('currentViewTitle');
            container.innerHTML = '';

            switch (appState.currentView) {
                case 'inicio':
                    titleEl.innerHTML = `<span>Inicio</span>`;
                    container.innerHTML = renderHomeView();
                    break;
                case 'secciones':
                    titleEl.innerHTML = `<span>Mis Secciones</span>`;
                    container.innerHTML = renderSectionsView();
                    break;
                case 'seccion-detalle':
                    const sec = appState.sections.find(s => s.id === appState.activeSectionId);
                    const secName = sec ? `${sec.icon || '📁'} ${sec.name}` : 'Sección';
                    titleEl.innerHTML = `<span>${secName}</span>`;
                    container.innerHTML = renderSectionDetailView(appState.activeSectionId);
                    break;
                case 'todas':
                    titleEl.innerHTML = `<span>Todas las Ideas</span>`;
                    container.innerHTML = renderAllIdeasView();
                    break;
                case 'terminadas':
                    titleEl.innerHTML = `<span>Ideas Terminadas</span>`;
                    container.innerHTML = renderTerminatedView();
                    break;
                case 'config':
                    titleEl.innerHTML = `<span>Copias de seguridad y Configuración</span>`;
                    container.innerHTML = renderConfigView();
                    break;

                filteredIdeas.map(idea => renderIdeaCard(idea)).join('');

        function getFilteredAndSortedIdeas() {
            let result = [...appState.ideas];

            // Search query
            if (appState.searchQuery && appState.searchQuery.trim() !== '') {
                const q = appState.searchQuery.toLowerCase();
                result = result.filter(i => 
                    i.title.toLowerCase().includes(q) || 
                    (i.hook && i.hook.toLowerCase().includes(q)) || 
                    (i.notes && i.notes.toLowerCase().includes(q))
                );
            }

            // Section filter
            if (appState.filterSection !== 'all') {
                result = result.filter(i => i.sectionId === appState.filterSection);
            }

            // Status filter
            if (appState.filterStatus !== 'all') {
                result = result.filter(i => i.status === appState.filterStatus);
            }

            // Sorting
            result.sort((a, b) => {
                if (appState.sortBy === 'newest') {
                    return new Date(b.createdAt) - new Date(a.createdAt);
                } else if (appState.sortBy === 'oldest') {
                    return new Date(a.createdAt) - new Date(b.createdAt);
                } else if (appState.sortBy === 'name') {
                    return a.title.localeCompare(b.title);
                } else if (appState.sortBy === 'status') {
                    return a.status.localeCompare(b.status);
                }
                return 0;
            });

            return result;
        }

        // --- VIEW 4: TERMINATED IDEAS HISTORY ---
        function renderTerminatedView() {
            const terminatedIdeas = appState.ideas.filter(i => i.status === 'Terminada');

            return `
                <div class="space-y-6 max-w-7xl mx-auto fade-in">
                    <div class="bg-cardbg border border-bordercolor rounded-2xl p-6">
                        <h3 class="text-base font-bold text-white">Historial de Ideas Terminadas</h3>
                        <p class="text-xs text-mutetext mt-1">Consulta todos los vídeos que ya has producido para TikTok y evita repetir contenido.</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        ${terminatedIdeas.length === 0 ? '<div class="col-span-full py-16 text-center text-mutetext text-xs bg-cardbg border border-bordercolor rounded-2xl">Todavía no has marcado ninguna idea como terminada.</div>' :
                          terminatedIdeas.map(idea => renderIdeaCard(idea)).join('')}
                    </div>
                </div>
            `;
        }

        // --- VIEW 5: CONFIG & BACKUPS ---
        function renderConfigView() {
            return `
                <div class="space-y-6 max-w-4xl mx-auto fade-in">
                    <!-- Export Box -->
                    <div class="bg-cardbg border border-bordercolor rounded-2xl p-6 space-y-4">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-xl bg-cyanaccent/10 border border-cyanaccent/30 flex items-center justify-center text-cyanaccent">
                                <i class="fa-solid fa-download"></i>
                            </div>
                            <div>
                                <h3 class="text-base font-bold text-white">Exportar Copia de Seguridad</h3>
                                <p class="text-xs text-mutetext">Descarga todas tus secciones e ideas en un archivo JSON seguro.</p>
                            </div>
                        </div>
                        <button onclick="exportJSON()" class="px-5 py-2.5 bg-cyanaccent hover:bg-cyanhover text-darkbg font-semibold rounded-xl text-xs transition-colors shadow-sm">
                            Exportar Archivo JSON
                        </button>
                    </div>

                    <!-- Import Box -->
                    <div class="bg-cardbg border border-bordercolor rounded-2xl p-6 space-y-4">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-xl bg-cyanaccent/10 border border-cyanaccent/30 flex items-center justify-center text-cyanaccent">
                                <i class="fa-solid fa-upload"></i>
                            </div>
                            <div>
                                <h3 class="text-base font-bold text-white">Importar Copia de Seguridad</h3>
                                <p class="text-xs text-mutetext">Restaura tus datos desde un archivo JSON previo. Los datos actuales serán reemplazados.</p>
                            </div>
                        </div>
                        <div>
                            <input type="file" id="importFile" accept=".json" onchange="importJSON(event)" class="block w-full text-xs text-mutetext file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-darkbg file:text-slate-200 hover:file:bg-cardhover file:cursor-pointer border border-bordercolor rounded-xl p-2 bg-darkbg">
                        </div>
                    </div>

                    <!-- Factory Reset Box -->
                    <div class="bg-cardbg border border-rose-500/30 rounded-2xl p-6 space-y-4">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-xl bg-rose-500/10 border border-rose-500/30 flex items-center justify-center text-rose-400">
                                <i class="fa-solid fa-triangle-exclamation"></i>
                            </div>
                            <div>
                                <h3 class="text-base font-bold text-white">Restablecer Datos de Fábrica</h3>
                                <p class="text-xs text-mutetext">Borra todos los cambios y vuelve a cargar las secciones y ejemplos iniciales.</p>
                            </div>
                        </div>
                        <button onclick="factoryReset()" class="px-5 py-2.5 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 font-semibold rounded-xl text-xs transition-colors">
                            Restablecer Aplicación
                        </button>
                    </div>
                </div>
            `;
        }

        // --- IDEA CARD COMPONENTS ---
        function renderIdeaCard(idea) {
            const sec = appState.sections.find(s => s.id === idea.sectionId);
            const secName = sec ? `${sec.icon || ''} ${sec.name}` : 'Sin sección';

            let statusBadgeClass = 'bg-amber-400/10 text-amber-400 border-amber-400/30';
            if (idea.status === 'Terminada') statusBadgeClass = 'bg-emerald-400/10 text-emerald-400 border-emerald-400/30';
            if (idea.status === 'En proceso') statusBadgeClass = 'bg-cyanaccent/10 text-cyanaccent border-cyanaccent/30';

            return `
                <div class="bg-cardbg border border-bordercolor rounded-2xl p-5 flex flex-col justify-between space-y-4 hover:border-cyanaccent/40 transition-all shadow-sm">
                    <div class="space-y-3">
                        <div class="flex items-start justify-between gap-2">
                            <span class="text-[10px] font-semibold px-2.5 py-1 rounded-full border ${statusBadgeClass}">${idea.status}</span>
                            <div class="flex items-center space-x-1">
                                <button onclick="toggleQuickStatus('${idea.id}')" class="p-1.5 text-mutetext hover:text-emerald-400 transition-colors" title="${idea.status === 'Terminada' ? 'Marcar pendiente' : 'Marcar terminada'}">
                                    <i class="fa-solid ${idea.status === 'Terminada' ? 'fa-rotate-left' : 'fa-check'} text-xs"></i>
                                </button>
                                <button onclick="editIdea('${idea.id}')" class="p-1.5 text-mutetext hover:text-white transition-colors" title="Editar idea">
                                    <i class="fa-solid fa-pen text-xs"></i>
                                </button>
                                <button onclick="duplicateIdea('${idea.id}')" class="p-1.5 text-mutetext hover:text-white transition-colors" title="Duplicar idea">
                                    <i class="fa-solid fa-copy text-xs"></i>
                                </button>
                                <button onclick="deleteIdea('${idea.id}')" class="p-1.5 text-mutetext hover:text-rose-400 transition-colors" title="Eliminar idea">
                                    <i class="fa-solid fa-trash text-xs"></i>
                                </button>
                            </div>
                        </div>

                        <div>
                            <h4 class="font-bold text-white text-base tracking-tight">${idea.title}</h4>
                            <p class="text-[11px] text-cyanaccent font-medium mt-0.5">${secName}</p>
                        </div>

                        ${idea.hook ? `<div class="bg-darkbg/70 border border-bordercolor/60 rounded-xl p-3 text-xs text-slate-300 italic">"${idea.hook}"</div>` : ''}
                        ${idea.notes ? `<p class="text-xs text-mutetext line-clamp-2">${idea.notes}</p>` : ''}
                    </div>

                    <div class="flex items-center justify-between pt-2 border-t border-bordercolor/60 text-[10px] text-mutetext">
                        <span>Creada: ${new Date(idea.createdAt).toLocaleDateString()}</span>
                        ${idea.completedAt ? `<span>Hecha: ${new Date(idea.completedAt).toLocaleDateString()}</span>` : ''}
                    </div>
                </div>
            `;
        }

        function renderIdeaCardCompact(idea) {
            const sec = appState.sections.find(s => s.id === idea.sectionId);
            const secName = sec ? `${sec.icon || ''} ${sec.name}` : '';

            let statusBadgeClass = 'bg-amber-400/10 text-amber-400';
            if (idea.status === 'Terminada') statusBadgeClass = 'bg-emerald-400/10 text-emerald-400';
            if (idea.status === 'En proceso') statusBadgeClass = 'bg-cyanaccent/10 text-cyanaccent';

            return `
                <div class="bg-darkbg/60 border border-bordercolor rounded-xl p-3 flex items-center justify-between gap-3 hover:border-cyanaccent/30 transition-all">
                    <div class="min-w-0 flex-1">
                        <div class="flex items-center space-x-2 mb-0.5">
                            <span class="text-[9px] font-semibold px-2 py-0.5 rounded-full ${statusBadgeClass}">${idea.status}</span>
                            <span class="text-[10px] text-mutetext truncate">${secName}</span>
                        </div>
                        <h4 class="text-xs font-bold text-white truncate">${idea.title}</h4>
                    </div>
                    <div class="flex items-center space-x-1">
                        <button onclick="toggleQuickStatus('${idea.id}')" class="p-1.5 text-mutetext hover:text-emerald-400 transition-colors" title="Cambiar estado">
                            <i class="fa-solid fa-check text-xs"></i>
                        </button>
                        <button onclick="editIdea('${idea.id}')" class="p-1.5 text-mutetext hover:text-white transition-colors" title="Editar">
                            <i class="fa-solid fa-pen text-xs"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        // --- IDEA MODAL & ACTIONS ---
        function openIdeaModal() {
            document.getElementById('ideaModalTitle').innerHTML = `<i class="fa-solid fa-lightbulb text-cyanaccent"></i><span>Nueva Idea de Contenido</span>`;
            document.getElementById('ideaId').value = '';
            document.getElementById('ideaTitle').value = '';
            document.getElementById('ideaHook').value = '';
            document.getElementById('ideaNotes').value = '';
            document.getElementById('ideaStatus').value = 'Pendiente';
            
            populateSectionDropdown();
            document.getElementById('ideaModal').classList.remove('hidden');
        }

        function openIdeaModalWithSection(secId) {
            openIdeaModal();
            document.getElementById('ideaSection').value = secId;
        }

        function editIdea(id) {
            const idea = appState.ideas.find(i => i.id === id);
            if (!idea) return;

            document.getElementById('ideaModalTitle').innerHTML = `<i class="fa-solid fa-pen text-cyanaccent"></i><span>Editar Idea</span>`;
            document.getElementById('ideaId').value = idea.id;
            document.getElementById('ideaTitle').value = idea.title;
            document.getElementById('ideaHook').value = idea.hook || '';
            document.getElementById('ideaNotes').value = idea.notes || '';
            document.getElementById('ideaStatus').value = idea.status;

            populateSectionDropdown();
            document.getElementById('ideaSection').value = idea.sectionId;
            document.getElementById('ideaModal').classList.remove('hidden');
        }

        function closeIdeaModal() {
            document.getElementById('ideaModal').classList.add('hidden');
        }

        function populateSectionDropdown() {
            const select = document.getElementById('ideaSection');
            select.innerHTML = appState.sections.map(s => `<option value="${s.id}">${s.icon || ''} ${s.name}</option>`).join('');
        }

        function saveIdeaForm(e) {
            e.preventDefault();
            const id = document.getElementById('ideaId').value;
            const title = document.getElementById('ideaTitle').value.trim();
            const sectionId = document.getElementById('ideaSection').value;
            const status = document.getElementById('ideaStatus').value;
            const hook = document.getElementById('ideaHook').value.trim();
            const notes = document.getElementById('ideaNotes').value.trim();

            if (!title) return;

            if (id) {
                // Edit
                const idx = appState.ideas.findIndex(i => i.id === id);
                if (idx !== -1) {
                    const wasTerminated = appState.ideas[idx].status === 'Terminada';
                    const isTerminated = status === 'Terminada';
                    let completedAt = appState.ideas[idx].completedAt;
                    if (!wasTerminated && isTerminated) completedAt = new Date().toISOString();
                    if (wasTerminated && !isTerminated) completedAt = null;

                    appState.ideas[idx] = {
                        ...appState.ideas[idx],
                        title,
                        sectionId,
                        status,
                        hook,
                        notes,
                        completedAt
                    };
                }
                showToast('Idea actualizada correctamente', 'success');
            } else {
                // Create
                const newIdea = {
                    id: 'idea-' + Date.now(),
                    title,
                    sectionId,
                    status,
                    hook,
                    notes,
                    createdAt: new Date().toISOString(),
                    completedAt: status === 'Terminada' ? new Date().toISOString() : null
                };
                appState.ideas.unshift(newIdea);
                showToast('Idea creada correctamente', 'success');
            }

            saveToLocalStorage();
            closeIdeaModal();
            renderCurrentView();
        }

        function toggleQuickStatus(id) {
            const idea = appState.ideas.find(i => i.id === id);
            if (!idea) return;

            if (idea.status === 'Terminada') {
                idea.status = 'Pendiente';
                idea.completedAt = null;
                showToast('Idea marcada como pendiente', 'info');
            } else {
                idea.status = 'Terminada';
                idea.completedAt = new Date().toISOString();
                showToast('¡Idea marcada como terminada!', 'success');
            }

            saveToLocalStorage();
            renderCurrentView();
        }

        function duplicateIdea(id) {
            const idea = appState.ideas.find(i => i.id === id);
            if (!idea) return;

            const duplicate = {
                ...idea,
                id: 'idea-' + Date.now(),
                title: idea.title + ' (Copia)',
                createdAt: new Date().toISOString(),
                completedAt: null,
                status: 'Pendiente'
            };

            appState.ideas.unshift(duplicate);
            saveToLocalStorage();
            renderCurrentView();
            showToast('Idea duplicada correctamente', 'success');
        }

        function deleteIdea(id) {
            appState.ideas = appState.ideas.filter(i => i.id !== id);
            saveToLocalStorage();
            renderCurrentView();
            showToast('Idea eliminada', 'info');
        }

        // --- SECTION MODAL & ACTIONS ---
        function openSectionModal() {
            document.getElementById('sectionModalTitle').innerHTML = `<i class="fa-solid fa-layer-group text-cyanaccent"></i><span>Nueva Sección</span>`;
            document.getElementById('sectionId').value = '';
            document.getElementById('sectionName').value = '';
            document.getElementById('sectionIcon').value = '📁';
            document.getElementById('sectionDesc').value = '';
            document.getElementById('sectionModal').classList.remove('hidden');
        }

        function editSection(id) {
            const sec = appState.sections.find(s => s.id === id);
            if (!sec) return;

            document.getElementById('sectionModalTitle').innerHTML = `<i class="fa-solid fa-pen text-cyanaccent"></i><span>Editar Sección</span>`;
            document.getElementById('sectionId').value = sec.id;
            document.getElementById('sectionName').value = sec.name;
            document.getElementById('sectionIcon').value = sec.icon || '📁';
            document.getElementById('sectionDesc').value = sec.description || '';
            document.getElementById('sectionModal').classList.remove('hidden');
        }

        function closeSectionModal() {
            document.getElementById('sectionModal').classList.add('hidden');
        }

        function saveSectionForm(e) {
            e.preventDefault();
            const id = document.getElementById('sectionId').value;
            const name = document.getElementById('sectionName').value.trim();
            const icon = document.getElementById('sectionIcon').value.trim() || '📁';
            const description = document.getElementById('sectionDesc').value.trim();

            if (!name) return;

            if (id) {
                const sec = appState.sections.find(s => s.id === id);
                if (sec) {
                    sec.name = name;
                    sec.icon = icon;
                    sec.description = description;
                }
                showToast('Sección actualizada', 'success');
            } else {
                const newSec = {
                    id: 'sec-' + Date.now(),
                    name,
                    icon,
                    description
                };
                appState.sections.push(newSec);
                showToast('Sección creada con éxito', 'success');
            }

            saveToLocalStorage();
            closeSectionModal();
            renderCurrentView();
        }

        function deleteSection(id) {
            const ideasInSec = appState.ideas.filter(i => i.sectionId === id).length;
            if (ideasInSec > 0) {
                if (!confirm(`Esta sección contiene ${ideasInSec} ideas. ¿Estás seguro de eliminarla? Las ideas quedarán sin sección o se eliminarán.`)) {
                    return;
                }
            }
            appState.sections = appState.sections.filter(s => s.id !== id);
            // Reassign or delete ideas
            appState.ideas = appState.ideas.filter(i => i.sectionId !== id);
            saveToLocalStorage();
            renderCurrentView();
            showToast('Sección eliminada', 'info');
        }

        // --- BACKUPS & CONFIG ACTIONS ---
        function exportJSON() {
            const data = {
                version: '1.0',
                exportDate: new Date().toISOString(),
                sections: appState.sections,
                ideas: appState.ideas
            };

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `rl_ideas_backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast('Copia de seguridad exportada con éxito', 'success');
        }

        function importJSON(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const parsed = JSON.parse(event.target.result);
                    if (!parsed.sections || !parsed.ideas) {
                        throw new Error("Estructura de archivo inválida.");
                    }

                    if (confirm(`¿Estás seguro de importar este archivo? Se reemplazarán tus ${appState.ideas.length} ideas actuales.`)) {
                        appState.sections = parsed.sections;
                        appState.ideas = parsed.ideas;
                        saveToLocalStorage();
                        renderCurrentView();
                        showToast('Copia de seguridad importada con éxito', 'success');
                    }
                } catch (err) {
                    console.error(err);
                    showToast('Error al importar archivo JSON. Verifique la estructura.', 'error');
                }
                e.target.value = '';
            };
            reader.readAsText(file);
        }

        function factoryReset() {
            if (confirm("¿Estás completamente seguro de restablecer la aplicación a los datos de fábrica? Se perderán las ideas personalizadas.")) {
                appState.sections = DEFAULT_SECTIONS;
                appState.ideas = DEFAULT_IDEAS;
                saveToLocalStorage();
                renderCurrentView();
                showToast('Aplicación restablecida a valores iniciales', 'info');
            }
        }

        // --- GLOBAL SEARCH HANDLER ---
        function handleGlobalSearch(val) {
            appState.searchQuery = val;
            if (appState.currentView !== 'todas') {
                switchView('todas');
            } else {
                renderAllIdeasGrid();
            }
        }

        // --- TOAST NOTIFICATIONS ---
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            
            let bgClass = 'bg-cardbg border-cyanaccent/40 text-white';
            let icon = 'fa-circle-check text-cyanaccent';
            if (type === 'error') {
                bgClass = 'bg-cardbg border-rose-500/40 text-white';
                icon = 'fa-triangle-exclamation text-rose-400';
            } else if (type === 'info') {
                bgClass = 'bg-cardbg border-bordercolor text-white';
                icon = 'fa-circle-info text-cyanaccent';
            }

            toast.className = `pointer-events-auto flex items-center space-x-3 px-4 py-3 rounded-xl border ${bgClass} shadow-xl fade-in text-xs font-medium`;
            toast.innerHTML = `<i class="fa-solid ${icon}"></i><span>${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Run on load
        window.onload = function() {
            initApp();
        };
    </script>
</body>
</html>
